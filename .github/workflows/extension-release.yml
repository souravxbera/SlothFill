name: Package extension

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the extension
        run: zip -r slothfill-extension.zip extension
      - name: Attach the zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: slothfill-extension.zip
