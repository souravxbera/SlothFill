<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Job — SlothFill</title>
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body>
  <div class="wrap">
    <header class="site">
      <a class="brand" href="index.html">SlothFill</a>
      <nav>
        <a href="setup.html">Setup</a>
        <a href="admission.html">Admission</a>
        <a href="kyc.html">KYC</a>
        <a class="here" href="job.html">Job</a>
        <a class="run-local" href="https://github.com/souravxbera/SlothFill#readme" target="_blank" rel="noopener noreferrer">How to run it locally</a>
      </nav>
    </header>
    <h1>Job application</h1>
    <p class="lede">Split names, a WhatsApp number the rules do not know, and a passport number the profile does not have.</p>
    <form>
      <div class="grid">
        <div class="field">
          <label for="first">First name</label>
          <input id="first" name="first" />
        </div>
        <div class="field">
          <label for="last">Last name</label>
          <input id="last" name="last" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" />
        </div>
        <div class="field">
          <label for="phone">Phone number</label>
          <input id="phone" name="phone" />
        </div>
        <div class="field">
          <label for="city">City</label>
          <input id="city" name="city" />
        </div>
        <div class="field">
          <label for="college">College</label>
          <input id="college" name="college" />
        </div>
        <div class="field">
          <label for="grad_year">Year of graduation</label>
          <input id="grad_year" name="grad_year" />
        </div>
        <div class="field">
          <label for="score">Percentage</label>
          <input id="score" name="score" />
        </div>
        <div class="field">
          <label for="whatsapp">WhatsApp number</label>
          <input id="whatsapp" name="whatsapp" />
        </div>
        <div class="field">
          <label for="passport">Passport number</label>
          <input id="passport" name="passport" />
        </div>
        <div class="field span-2">
          <label for="portfolio">Portfolio URL</label>
          <input id="portfolio" name="portfolio" type="url" placeholder="https://" />
        </div>
      </div>
      <div class="actions">
        <button type="button" id="slothfill">Fill from local profile</button>
        <button type="submit">Submit application</button>
      </div>
      <p id="slothfill-status" class="status"></p>
    </form>
  </div>
  <script src="fill.js"></script>
</body>
</html>
