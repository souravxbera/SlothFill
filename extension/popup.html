<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SlothFill</title>
  <style>
    body { margin: 0; width: 280px; font: 14px/1.45 "Segoe UI", system-ui, sans-serif; color: #1a2420; background: #f4efe6; }
    main { padding: 16px; }
    h1 { font-size: 16px; margin: 0 0 6px; letter-spacing: -0.03em; }
    h1::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: #1f6b45; box-shadow: 0 0 0 3px #e5f3eb; }
    p { margin: 0; color: #5c6b63; }
    button { width: 100%; margin-top: 14px; border: 0; border-radius: 10px; background: #1f6b45; color: white; padding: 10px; font: inherit; cursor: pointer; }
    button:hover { background: #164d32; }
    button:disabled { opacity: 0.55; cursor: default; }
    #status { margin-top: 10px; min-height: 3.2em; }
    a { display: inline-block; margin-top: 8px; color: #164d32; font-weight: 700; text-underline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>SlothFill</h1>
    <p>Fill this page from the profile on this computer. It will not submit.</p>
    <button id="fill" type="button">Fill this page</button>
    <p id="status"></p>
    <a href="https://github.com/souravxbera/SlothFill#readme" target="_blank" rel="noopener noreferrer">How to run it locally</a>
  </main>
  <script src="popup.js"></script>
</body>
</html>
